      '#options':
        '': Select
        'No': 'No'
        'Yes': 'Yes'
        Unknown: Unknown
    frame_overo:
      '#type': select
      '#title': 'Frame overo'
      '#options':
        '': Select
        'No': 'No'
        'Yes': 'Yes'
        Unknown: Unknown
    tobiano:
      '#type': select
      '#title': Tobiano
      '#options':
        '': Select
        'No': 'No'
        'Yes': 'Yes'
        Unknown: Unknown
    dilute:
      '#type': select
      '#title': Dilute
      '#options':
        '': Select
        'No': 'No'
        'Yes': 'Yes'
        Double: Double
        Unknown: Unknown
    sire:
      '#type': textfield
      '#title': Sire
      '#required': true
    dam:
      '#type': textfield
      '#title': Dam
      '#required': true
    mare_status:
      '#type': select
      '#title': 'Mare status'
      '#required': true
      '#options':
        '': Select
        Maiden: Maiden
        'In Foal': 'In Foal'
        Empty: Empty
    last_service_date:
      '#type': textfield
      '#title': 'Last service date (if known)'
    through_bred:
      '#type': radios
      '#title': 'Registered ASB Thoroughbred?'
      '#options':
        'no': 'No'
        'yes': 'Yes'
      '#default_value': 'no'
    breed:
      '#type': textfield
      '#title': 'Breed (if not thoroughbred)'
    mare_registered:
      '#type': radios
      '#title': 'Registered with another society?'
      '#options':
        'no': 'No'
        'yes': 'Yes - what society or societies?'
      '#default_value': 'no'
    society:
      '#type': textfield
      '#title': 'Society name'
  service_stallion:
    '#type': fieldset
    '#title': 'Service & stallion'
    service_required:
      '#type': select
      '#title': 'Type of service required'
      '#required': true
      '#options':
        '': Select
        'Live Cover': 'Live Cover'
        'Walk-on Walk-off': 'Walk-on Walk-off'
        A.I: A.I
    conception_month:
      '#type': select
      '#title': 'Month conception is required'
      '#required': true
      '#options':
        '': Select
        January: January
        February: February
        March: March
        April: April
        May: May
        June: June
        July: July
        August: August
        September: September
        October: October
        November: November
        December: December
    preferred_stallion:
      '#type': textfield
      '#title': 'Preferred stallion'
      '#required': true
  contact_details:
    '#type': fieldset
    '#title': 'Your details'
    first_name:
      '#type': textfield
      '#title': 'First name'
      '#required': true
    last_name:
      '#type': textfield
      '#title': Surname
      '#required': true
    phone:
      '#type': tel
      '#title': Phone
      '#required': true
    mobile:
      '#type': tel
      '#title': Mobile
    business_name:
      '#type': textfield
      '#title': 'Business name'
    email:
      '#type': email
      '#title': Email
      '#required': true
    address_line1:
      '#type': textfield
      '#title': 'Address line 1'
    address_line2:
      '#type': textfield
      '#title': 'Address line 2'
    town:
      '#type': textfield
      '#title': Town
    postcode:
      '#type': textfield
      '#title': Postcode
    state:
      '#type': select
      '#title': State
      '#options':
        '': Select
        NSW: NSW
        ACT: ACT
        VIC: VIC
        QLD: QLD
        TAS: TAS
        SA: SA
        WA: WA
        NT: NT
    how_heard:
      '#type': textfield
      '#title': 'How did you first hear about Winning Colours Farm?'
  additional:
    '#type': fieldset
    '#title': Additional
    message:
      '#type': textarea
      '#title': 'Notes / message'
      '#required': true
      '#rows': 5
    terms:
