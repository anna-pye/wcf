id: wcf_d7_taxonomy_term_tags
label: 'WCF D7 taxonomy terms (tags)'
audit: true
migration_tags:
  - WCF
  - Drupal 7
  - Taxonomy
source:
  plugin: d7_taxonomy_term
  bundle: tags
process:
  tid: tid
  revision_id: tid
  vid:
    plugin: default_value
    default_value: tags
  name: name
  'description/value': description
  'description/format':
    plugin: default_value
    default_value: basic_html
  weight: weight
  parent_id:
    -
      plugin: skip_on_empty
      method: process
      source: parent
    -
      plugin: migration_lookup
      migration: wcf_d7_taxonomy_term_tags
  parent:
    plugin: default_value
    default_value: 0
    source: '@parent_id'
  changed: timestamp
  langcode:
    plugin: default_value
    default_value: en
destination:
  plugin: entity:taxonomy_term
  default_bundle: tags
